            documento da firmare, lettera, altro), oppure — solo se il
            sotto-documento ha gia' quella classificazione dall'estrazione AI
            — il valore libero assegnato dal classificatore Bedrock (UC-43):
            un "Salva" senza toccare il campo non deve rompersi su un
            documento gia' classificato fuori enum. Non e' un OpenAPI `enum`

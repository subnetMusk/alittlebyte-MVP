openapi: 3.1.1
info:
  title: Alittlebyte MVP API
  version: 1.0.0
  description: Versioned JSON contract consumed by the Angular SPA.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security:
  - MvpIdentity: []
tags:
  - name: State
    description: Current assistant and document pipeline state for the SPA.
  - name: Communications
    description: AI-assisted communication generation.
  - name: Documents
    description: Document upload, processing stream, preview and deletion.
paths:
  /api/v1/state:
    get:
      summary: Get current MVP state
      operationId: getMvpState
      tags: [State]
      responses:
        "200":
          description: Current operational state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MvpState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/communications:
    get:
      summary: List the tenant communication drafts, optionally filtered
      operationId: listMvpCommunications
      tags: [Communications]
      parameters:
        - name: keyword
          in: query
          required: false
          description: Ricerca nel prompt della generazione (UC-15).
          schema:
            type: string
            maxLength: 255
        - name: tone
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
        - name: style
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
        - name: date
          in: query
          required: false
          description: Giorno di creazione della bozza, in formato ISO.
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Bozze corrispondenti ai filtri, escluse quelle scartate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommunicationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Request an AI communication draft
      operationId: generateMvpCommunication
      tags: [Communications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCommunicationRequest"
      responses:
        "202":
          description: Generation accepted and delegated to the communication pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartCommunicationGenerationResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/prompt-configurations:
    post:
      summary: Save the current prompt configuration for later reuse (UC-19)
      operationId: saveMvpPromptConfiguration
      tags: [Communications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePromptConfigurationRequest"
      responses:
        "201":
          description: Prompt configuration saved to history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavePromptConfigurationResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/prompt-configurations/{promptConfiguration}:
    delete:
      summary: Permanently delete a saved prompt configuration
      operationId: deleteMvpPromptConfiguration
      tags: [Communications]
      parameters:
        - name: promptConfiguration
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Prompt configuration deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDocumentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/communications/{communication}/favorite:
    post:
      summary: Add a communication to favorites
      operationId: favoriteMvpCommunication
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Communication added to favorites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCommunicationFavoriteResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Remove a communication from favorites
      operationId: unfavoriteMvpCommunication
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Communication removed from favorites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCommunicationFavoriteResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/communications/{communication}:
    put:
      summary: Update the title and body of a draft communication
      operationId: updateMvpCommunication
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommunicationRequest"
      responses:
        "200":
          description: Communication draft updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCommunicationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Permanently delete a communication from history
      operationId: deleteMvpCommunication
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Communication deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDocumentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/communications/{communication}/regenerate:
    post:
      summary: Regenerate a communication draft
      operationId: regenerateMvpCommunication
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "202":
          description: Regeneration accepted and delegated to the communication pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartCommunicationGenerationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/communications/{communication}/save:
    post:
      summary: Save a communication draft to history, leaving it editable and regenerable
      operationId: saveMvpCommunication
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Communication saved to history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationMutationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/communications/{communication}/discard:
    post:
      summary: Discard a communication draft
      operationId: discardMvpCommunication
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Communication discarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationMutationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/communications/{communication}/stream:
    get:
      summary: Stream communication generation events
      operationId: streamMvpCommunicationGeneration
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Server-sent events for communication generation.
          content:
            text/event-stream:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/communications/{communication}/cover-image:
    get:
      summary: Download the communication cover image
      operationId: showMvpCommunicationCoverImage
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Cover image binary.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Replace communication cover image manually
      operationId: updateMvpCommunicationCoverImage
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Cover image updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationMutationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Remove communication cover image
      operationId: removeMvpCommunicationCoverImage
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Cover image removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationMutationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/communications/{communication}/preview:
    get:
      summary: Preview the final laid-out communication PDF
      operationId: previewMvpCommunication
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: PDF preview stream.
          headers:
            ETag:
              $ref: "#/components/headers/PdfETag"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "304":
          description: Il PDF non e' cambiato rispetto all'ETag inviato dal client.
          headers:
            ETag:
              $ref: "#/components/headers/PdfETag"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/communications/{communication}/export:
    get:
      summary: Export the communication as a finalized downloadable PDF
      operationId: exportMvpCommunication
      tags: [Communications]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: PDF attachment.
          headers:
            ETag:
              $ref: "#/components/headers/PdfETag"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "304":
          description: Il PDF non e' cambiato rispetto all'ETag inviato dal client.
          headers:
            ETag:
              $ref: "#/components/headers/PdfETag"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/communications/{communication}/rating:
    post:
      summary: Assign a 1–5 star rating to a generated communication draft
      operationId: rateMvpCommunication
      tags: [Communications]
      parameters:
        - name: communication
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateCommunicationRequest"
      responses:
        "200":
          description: Rating stored for the draft; further ratings for this generation are rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCommunicationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/documents:
    get:
      summary: List the tenant sub-documents, optionally filtered
      operationId: listMvpDocuments
      tags: [Documents]
      parameters:
        - name: search
          in: query
          required: false
          description: Ricerca su nome, cognome e azienda dei dati estratti (UC-35).
          schema:
            type: string
            maxLength: 255
        - name: sendStatus
          in: query
          required: false
          description: >-
            Stato di scaricamento del messaggio precompilato in PDF (UC-36). L'invio non fa parte
            del perimetro MVP; i valori `pending`/`sent` dell'enum restano per compatibilita' del
            contratto, ma si leggono come "Non scaricato" e "Scaricato".
          schema:
            $ref: "#/components/schemas/SubDocumentSendStatus"
        - name: confidenceThreshold
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: confidenceCriterion
          in: query
          required: false
          schema:
            type: string
            enum: [above, below]
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Sub-documents matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDocumentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/documents/ocr:
    post:
      summary: Upload a document for OCR and AI extraction
      operationId: uploadMvpDocument
      tags: [Documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  format: binary
                documentType:
                  description: >
                    Tipologia documento impostata manualmente in upload.
                    Se presente, prevale sull'estrazione AI e non viene sovrascritta.
                  type: [string, "null"]
                  enum: [cedolino, CU, comunicazione, documento da firmare, lettera, altro]
                companyName:
                  description: >
                    Azienda di riferimento impostata manualmente in upload.
                    Se presente, prevale sull'estrazione AI e non viene sovrascritta.
                  type: [string, "null"]
                  maxLength: 500
                month:
                  description: >
                    Mese di riferimento (1-12) impostato manualmente in upload.
                    Combinato con year forma la data documento preservata dall'AI.
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 12
                year:
                  description: >
                    Anno di riferimento impostato manualmente in upload.
                    Combinato con month forma la data documento preservata dall'AI.
                  type: [integer, "null"]
                  minimum: 1900
                  maximum: 2100
      responses:
        "202":
          description: Document accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/documents/{originalDocument}/stream:
    get:
      summary: Stream document processing events
      operationId: streamMvpDocumentProcessing
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/OriginalDocumentId"
      responses:
        "200":
          description: Server-sent events for document processing.
          content:
            text/event-stream:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/documents/{subDocument}:
    delete:
      summary: Delete a processed sub-document
      operationId: deleteMvpSubDocument
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/SubDocumentId"
      responses:
        "200":
          description: Document deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDocumentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/documents/{subDocument}/extracted-data:
    put:
      summary: Correct extracted data for a sub-document
      operationId: updateMvpSubDocumentExtractedData
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/SubDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExtractedDataRequest"
      responses:
        "200":
          description: Extracted data updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSubDocumentReviewResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/documents/{subDocument}/review:
    post:
      summary: Mark a sub-document as manually reviewed
      operationId: reviewMvpSubDocument
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/SubDocumentId"
      responses:
        "200":
          description: Sub-document manually validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSubDocumentReviewResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/documents/{subDocument}/preview:
    get:
      summary: Preview a processed sub-document PDF
      operationId: previewMvpSubDocument
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/SubDocumentId"
      responses:
        "200":
          description: PDF preview stream.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/documents/{subDocument}/send-preview:
    get:
      summary: Preview the precompiled send message for a sub-document
      operationId: sendPreviewMvpSubDocument
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/SubDocumentId"
      responses:
        "200":
          description: PDF preview stream.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The extracted data for this sub-document has not been confirmed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/documents/{subDocument}/send-export:
    get:
      summary: Export the precompiled send message for a sub-document as a downloadable PDF
      operationId: sendExportMvpSubDocument
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/SubDocumentId"
      responses:
        "200":
          description: PDF attachment.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The extracted data for this sub-document has not been confirmed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/documents/{subDocument}/send-message:
    put:
      summary: Correct the precompiled send message fields for a sub-document
      operationId: updateMvpSubDocumentSendMessage
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/SubDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSendMessageRequest"
      responses:
        "200":
          description: Send message updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSubDocumentReviewResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    MvpIdentity:
      type: apiKey
      in: header
      name: X-Mvp-User-Id
      description: Identity claims injected by the enterprise boundary or local MVP middleware.
  headers:
    PdfETag:
      description: >-
        Impronta del contenuto del PDF (titolo, corpo, copertina). Cambia solo
        quando cambia il documento renderizzato.
      schema:
        type: string
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        ETag ottenuto da una risposta precedente. Se coincide con il PDF
        corrente il server risponde 304 senza rigenerare il documento.
      schema:
        type: string
    OriginalDocumentId:
      name: originalDocument
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SubDocumentId:
      name: subDocument
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CommunicationId:
      name: communication
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Missing or invalid identity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Identity lacks required role or attribute.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpstreamUnavailable:
      description: Required upstream service failed explicitly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    MvpState:
      type: object
      required: [assistant, copilot]
      properties:
        assistant:
          $ref: "#/components/schemas/AssistantState"
        copilot:
          $ref: "#/components/schemas/CopilotState"
    AssistantState:
      type: object
      required: [metrics, history, promptConfigurations]
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        history:
          type: array
          items:
            $ref: "#/components/schemas/Communication"
        promptConfigurations:
          type: array
          items:
            $ref: "#/components/schemas/PromptConfiguration"
    CopilotState:
      type: object
      required: [metrics, documents]
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/SubDocument"
    Metric:
      type: object
      required: [key, value, label]
      properties:
        key:
          type: string
          description: Identificativo stabile della metrica. La label è testo di presentazione e può cambiare; per selezionare una metrica si usa la key.
        value:
          oneOf:
            - type: integer
            - type: string
        label:
          type: string
        threshold:
          type: number
          description: >-
            Valore oltre il quale il sistema decide da solo, per le metriche che ne hanno uno
            (la confidenza media OCR ha la soglia di validazione automatica). Lo conosce solo
            il backend, che la legge dalla configurazione: l'interfaccia la mostra sulla scala
            della scheda ma non la stabilisce.
        unit:
          type: string
          description: >-
            Unità di misura del valore, quando ne ha una ("%", "s", "min", "/ 5").
            Sta nel contratto e non nel frontend perché è un fatto della metrica:
            è chi la calcola a sapere se una media è in secondi o in minuti, e
            una tabella chiave → unità nell'interfaccia andrebbe fuori sincrono
            alla prima metrica aggiunta. Assente sui conteggi, che sono numeri
            puri.
        outOf:
          type: integer
          minimum: 0
          description: >-
            Totale di riferimento, per le metriche che sono una quota di un insieme
            ("1.207 sotto-documenti verificati su 1.284"). È un fatto del dato, non una scelta
            di resa: il denominatore lo conosce chi calcola il numeratore.
        parts:
          type: array
          description: >-
            Ripartizione del valore fra le sue componenti, in ordine di lettura: il tempo medio di
            una pipeline si spende in fasi (OCR, estrazione, salvataggio), un insieme di documenti
            si divide fra gli stati in cui si trovano. La somma delle parti è il valore.
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
              value:
                type: number
                minimum: 0
              tone:
                type: string
                enum: [neutral, info, success, warning, danger]
                description: >-
                  Rilievo della parte, quando ne ha uno proprio. Gli stati di revisione e di
                  scaricamento lo dichiarano già nel dominio (`ReviewStatus::color()`), quindi
                  arriva da lì invece di essere ricostruito da una tabella nell'interfaccia.
                  Assente sulle ripartizioni che non esprimono un giudizio — le fasi di una
                  pipeline, dove verde e rosso direbbero qualcosa che il dato non dice.
        distribution:
          type: array
          description: >-
            Densità delle durate: quante elaborazioni cadono in ciascun intervallo di tempo,
            dagli intervalli più brevi ai più lunghi. Gli intervalli hanno tutti la stessa ampiezza
            e `upTo` è l'estremo superiore in secondi, così l'interfaccia può disegnare l'asse
            senza ricostruire i confini.
          items:
            type: object
            required: [upTo, count]
            properties:
              upTo:
                type: number
                minimum: 0
              count:
                type: integer
                minimum: 0
        sampleSize:
          type: integer
          minimum: 0
          description: >-
            Quante misure stanno dietro una distribuzione o una media. Con pochi campioni una curva
            di densità è più interpolazione che dato: l'interfaccia la sostituisce con una riga di
            testo, e per farlo deve sapere quante ne ha.
        history:
          type: array
          description: >-
            Conteggio giornaliero degli ultimi sette giorni, dal più vecchio al più recente.
            È il flusso di ingresso — quanti elementi sono entrati in quello stato ogni giorno —
            non la storia del totale, che richiederebbe snapshot giornalieri non conservati dal
            modello dati. Va quindi presentato come "n nuovi oggi", mai come variazione del valore.
            Assente sulle metriche per cui un flusso non ha significato, come le medie.
          minItems: 7
          maxItems: 7
          items:
            type: integer
            minimum: 0

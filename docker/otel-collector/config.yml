# Il Collector fa da gateway delle metriche: raschia l'exporter applicativo,
# Traefik e se stesso, e le espone a Prometheus su :9464. Non riceve OTLP:
# nell'applicazione non c'e' un SDK OpenTelemetry che produca trace o log.
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: mvp-app
          scrape_interval: 15s
          metrics_path: /internal/metrics
          static_configs:
            - targets:
                - nginx:8081
              labels:
                service_namespace: alittlebyte
                service_name: mvp-document-pipeline

        - job_name: mvp-traefik
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets:
                - traefik:9100
              labels:
                service_namespace: alittlebyte
                service_name: mvp-edge

        - job_name: mvp-otel-collector
          scrape_interval: 30s
          static_configs:
            - targets:
                - otel-collector:8888
              labels:
                service_namespace: alittlebyte
                service_name: mvp-otel-collector

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    # I nomi arrivano gia' conformi alla convenzione Prometheus dalla sorgente:
    # qui il Collector e' un gateway di trasporto, non un normalizzatore. Con il
    # default (true) appendeva _total ai sum monotoni il cui nome non lo aveva
    # gia', trasformando mvp_textract_confidence_sum in
    # mvp_textract_confidence_sum_total: le dashboard interrogavano il nome
    # originale e i pannelli di confidenza e durata OCR restavano vuoti pur
    # avendo il dato (misurato: 96.8% di confidenza media non mostrata).
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    metrics:
      receivers:
        - prometheus
      processors:
        - memory_limiter
        - batch
      exporters:
        - prometheus

groups:
  - name: mvp-pipeline-alerts
    rules:
      - alert: WorkerDown
        expr: absent(mvp_app_info{service_name="mvp-document-pipeline"} == 1)
        for: 5m
        labels:
          severity: warning
          service_namespace: alittlebyte
        annotations:
          summary: "Application scrape missing"
          description: "The application metrics scrape is missing from the OTel exporter."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/observability.md"

      - alert: DocumentStuckInProcessing
        expr: mvp_documents_stuck_processing > 0
        for: 10m
        labels:
          severity: warning
          service_namespace: alittlebyte
        annotations:
          summary: "Document stuck in processing"
          description: "At least one document has exceeded the processing timeout."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/document-pipeline.md"

      - alert: StepFunctionExecutionFailed
        expr: increase(mvp_stepfunctions_executions_failed_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
          service_namespace: alittlebyte
        annotations:
          summary: "Step Functions execution failure observed"
          description: "The document workflow reported a Step Functions failure."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/document-pipeline.md"

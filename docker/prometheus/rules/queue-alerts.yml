groups:
  - name: mvp-queue-alerts
    rules:
      # I due lati vanno aggregati entrambi: senza `sum()` il lato sinistro
      # porta la label task_type e il destro status, insiemi disgiunti, quindi
      # il vector matching di `and` non produceva mai un risultato e questo
      # alert non poteva scattare in nessuna condizione. Le serie a zero delle
      # metriche SQS arrivano da DomainMetricCatalog: senza, `== 0` non avrebbe
      # nulla su cui valutare finche' il primo messaggio non viene consumato.
      - alert: QueueBacklogHigh
        expr: |
          sum(increase(mvp_sqs_messages_received_total[30m])) == 0
            and on()
          sum(mvp_original_documents{status="processing"}) > 0
        for: 15m
        labels:
          severity: warning
          service_namespace: alittlebyte
        annotations:
          summary: "Workflow queue may be stalled"
          description: "Documents are processing but no SQS messages were consumed recently."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/document-pipeline.md"

      # Profondita' reale della coda, letta da SQS a ogni scrape. Prima questa
      # espressione leggeva un counter monotono alimentato a mano dal comando
      # mvp:dlq:list: non poteva scattare prima della prima esecuzione manuale
      # e restava appesa per sempre dopo. `for` a 5m perche' un messaggio in
      # DLQ e' durevole e un singolo scrape perso non deve far flappare un
      # alert critical.
      - alert: DLQNotEmpty
        expr: mvp_dlq_messages{queue="documents"} > 0
        for: 5m
        labels:
          severity: critical
          service_namespace: alittlebyte
        annotations:
          summary: "Document workflow DLQ contains messages"
          description: "Run php artisan mvp:dlq:list --queue=documents to inspect failed messages."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/dlq-recovery.md"

      # Senza questo, una probe rotta spegnerebbe in silenzio i due alert
      # critical sulle DLQ: la serie di profondita' sparisce e `> 0` smette di
      # valutare, che e' indistinguibile da "coda vuota".
      - alert: DlqProbeDown
        expr: mvp_dlq_probe_up == 0
        for: 10m
        labels:
          severity: warning
          service_namespace: alittlebyte
        annotations:
          summary: "DLQ depth probe unavailable"
          description: "{{ $labels.queue }}: GetQueueAttributes is failing, so DLQNotEmpty cannot be trusted."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/dlq-recovery.md"

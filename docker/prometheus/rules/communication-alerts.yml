groups:
  - name: mvp-communication-alerts
    rules:
      - alert: CommunicationPipelineTaskFailed
        expr: increase(mvp_sqs_messages_failed_total{task_type=~"communication.*"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
          service_namespace: alittlebyte
        annotations:
          summary: "Communication pipeline task failed"
          description: "A generation task failed; the communication is marked as failed."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/communication-pipeline.md"

      - alert: CommunicationStuckInProcessing
        expr: mvp_communications_stuck_processing > 0
        for: 10m
        labels:
          severity: warning
          service_namespace: alittlebyte
        annotations:
          summary: "Communication stuck in generation"
          description: "A communication has been generating beyond MVP_COMMUNICATION_TIMEOUT_SECONDS."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/communication-pipeline.md"

      # Soglia sopra zero: una copertina degradata e' un esito previsto e non
      # invalida la comunicazione, allarmare al primo evento produrrebbe rumore.
      - alert: CommunicationCoverGenerationDegraded
        expr: increase(mvp_communication_covers_failed_total[30m]) > 3
        for: 5m
        labels:
          severity: warning
          service_namespace: alittlebyte
        annotations:
          summary: "Communication cover generation is degrading"
          description: "Several covers failed in the last 30 minutes; check the image model configuration."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/communication-pipeline.md"

      - alert: CommunicationCoverStorageFailing
        expr: increase(mvp_communication_cover_storage_failed_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
          service_namespace: alittlebyte
        annotations:
          summary: "Communication cover storage is failing"
          description: "Covers cannot be written to or deleted from the document storage."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/communication-pipeline.md"

      - alert: CommunicationDLQNotEmpty
        expr: mvp_dlq_messages{queue="communications"} > 0
        for: 1m
        labels:
          severity: critical
          service_namespace: alittlebyte
        annotations:
          summary: "Communication workflow DLQ contains messages"
          description: "Run php artisan mvp:dlq:list --queue=communications to inspect failed messages."
          runbook: "https://github.com/subnetMusk/alittlebyte-MVP/blob/main/docs/runbooks/dlq-recovery.md"

; Override del pool di default dell'immagine php:8.4-fpm (pm.max_children=5),
; troppo basso per questa applicazione: ogni stream SSE aperto (upload
; documenti, generazione comunicazioni) tiene occupato un worker PHP-FPM
; fino a 1800s/900s (vedi timeout in DocumentController::stream()/
; CommunicationStreamController::stream()). Con 5 worker totali, 3-5
; utenti che aprono lo stream in contemporanea esaurirebbero l'intero pool,
; bloccando anche /health e /ready per tutti gli altri.
;
; Valori dimensionati per uso locale/demo (nessun limite di memoria sul
; container in docker-compose.yml): margine per alcuni stream SSE lunghi
; in parallelo piu' le richieste API brevi ordinarie.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

name: CI

# Pipeline composta da quattro job con responsabilità separate:
#   backend: build immagine app di sviluppo, controlli PHP e coverage globale
#   frontend: suite SPA, contratto OpenAPI e coverage globale
#   coverage-diff: coverage del codice modificato rispetto al commit base
#                  dell'evento (push o pull request)
#   stack: IaC, osservabilità, build di produzione, scansione Trivy,
#          smoke HTTPS, accessibilità e pubblicazione GHCR
# Ogni job acquisisce le immagini esterne senza pull anonimi: mirror GHCR
# (autenticato, nessun rate limit per-IP) con fallback upstream; il job stack
# usa anche la cache di Actions (zero pull a cache hit). Vedi
# scripts/ci/resolve-images.sh e .github/workflows/mirror-images.yml.

# La CI gira su ogni push di ogni branch, non solo su develop/main e in PR:
# chi lavora su un branch di feature vede i test rossi mentre sta sviluppando,
# invece di scoprirli quando il branch e' gia' da mergiare.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  # Push e pull request dello stesso branch condividono il gruppo. Rimane una
  # sola esecuzione completa, con tutti i job previsti dalla pipeline.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # secrets non è disponibile in steps[*].if: va mappato su env
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull PHP base image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning::Login GHCR fallito, uso solo gli upstream"
          grep -E '^FROM ' docker/php/Dockerfile | awk '{print $2}' > /tmp/base-images.txt
          bash scripts/ci/pull-images.sh /tmp/base-images.txt

      - name: Build app image
        run: docker compose build app

      - name: Validate Composer manifest
        run: docker compose run --rm --no-deps app composer validate --strict

      - name: Run Pint
        run: docker compose run --rm --no-deps app php vendor/bin/pint --test

      - name: Run Larastan
        run: >
          docker compose run --rm --no-deps
          -e CONFIG_SOURCE=env
          -e APP_ENV=testing
          -e CACHE_STORE=array
          -e SESSION_DRIVER=array
          -e QUEUE_CONNECTION=sync
          -e DB_CONNECTION=sqlite
          -e DB_DATABASE=:memory:
          -e DB_HOST=
          -e DB_PORT=
          -e DB_USERNAME=
          -e DB_PASSWORD=
          app vendor/bin/phpstan analyse --memory-limit=1G

      # Verifica meccanica della Dependency Rule (ADR 0010): il livello
      # Domain dei domini esagonali non deve importare Illuminate\*, Aws\*,
      # o modelli Eloquent.
      - name: Check hexagonal Dependency Rule
        run: bash scripts/ci/check-dependency-rule.sh

      # L'immagine applicativa usa www-data. Su un runner Linux Docker crea un
      # bind mount mancante come root e Pest non può scriverci i report.
      - name: Prepare backend coverage directory
        run: |
          mkdir -p coverage
          chmod 0777 coverage

      - name: Run Pest with coverage
        run: >
          docker compose run --rm --no-deps
          -v "$PWD/coverage:/var/www/html/coverage"
          -e XDEBUG_MODE=coverage
          -e CONFIG_SOURCE=env
          -e APP_ENV=testing
          -e CACHE_STORE=array
          -e SESSION_DRIVER=array
          -e QUEUE_CONNECTION=sync
          -e DB_CONNECTION=sqlite
          -e DB_DATABASE=:memory:
          -e DB_HOST=
          -e DB_PORT=
          -e DB_USERNAME=
          -e DB_PASSWORD=
          app php -d memory_limit=1G vendor/bin/pest
          --display-warnings
          --coverage
          --path-coverage
          --coverage-cobertura coverage/cobertura.xml
          --coverage-html coverage/html

      # Pest scrive i report come www-data del container: il runner li legge ma
      # non puo' riscriverli, e la normalizzazione in place fallirebbe. Si riprende
      # la proprieta' invece di derivare un secondo file, cosi' il Cobertura resta
      # l'unica fonte del dato di coverage del backend.
      - name: Take ownership of backend coverage reports
        run: sudo chown -R "$(id -u):$(id -g)" coverage

      # Il report esce con i path assoluti del container: senza questa riscrittura
      # diff-cover non aggancia nessun file e il gate sul diff passerebbe a vuoto.
      - name: Normalize backend coverage paths
        run: node scripts/ci/normalize-cobertura-paths.mjs coverage/cobertura.xml /var/www/html

      # Unico gate sui minimi globali del backend: Pest non usa piu' --min, che
      # ripeteva la stessa soglia sulla stessa metrica ignorando i branch.
      - name: Check backend coverage thresholds
        run: node scripts/ci/check-coverage-thresholds.mjs backend coverage/cobertura.xml

      - name: Upload backend coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/cobertura.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage/html
          if-no-files-found: warn
          retention-days: 7

      # Controparte PHP dell'audit npm del job frontend: come quello, guarda le
      # sole dipendenze di produzione ed e' in coda, cosi' un advisory non
      # nasconde l'esito dei test. I pacchetti abbandonati vengono riportati ma
      # non fanno fallire il job: non sono vulnerabilita'.
      # --locked audita quanto dichiarato dal lock, non il vendor cotto
      # nell'immagine, cosi' il gate resta indipendente dal momento del build.
      # La soglia e' applicata dallo script: composer da solo fallisce su
      # qualsiasi severita' e non sa filtrarla.
      - name: Audit production PHP dependencies
        run: >
          docker compose run --rm --no-deps app
          composer audit --locked --no-dev --abandoned=report --format=json
          | node scripts/ci/check-composer-advisories.mjs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull node image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning::Login GHCR fallito, uso solo gli upstream"
          docker compose --profile tools config --format json | jq -er '.services.node.image' > /tmp/node-image.txt
          bash scripts/ci/pull-images.sh /tmp/node-image.txt

      - name: Install Node dependencies
        run: docker compose --profile tools run --rm node npm ci --ignore-scripts

      - name: Lint OpenAPI contract
        run: docker compose --profile tools run --rm node npx --yes @redocly/cli@latest lint openapi/v1/alittlebyte-mvp-api.yaml

      - name: Generate OpenAPI client
        run: docker compose --profile tools run --rm node npm run openapi:generate

      - name: Check generated client is committed
        run: git diff --exit-code -- apps/frontend/src/api/generated

      - name: Lint SPA
        run: docker compose --profile tools run --rm node npm run frontend:lint

      - name: Typecheck SPA
        run: docker compose --profile tools run --rm node npm run frontend:typecheck

      - name: Test SPA with coverage
        run: docker compose --profile tools run --rm node sh -lc 'cd apps/frontend && npx jest --coverage --runInBand'

      - name: Check frontend coverage thresholds
        run: node scripts/ci/check-coverage-thresholds.mjs frontend apps/frontend/coverage/coverage-summary.json

      - name: Upload frontend coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            apps/frontend/coverage/lcov.info
            apps/frontend/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: apps/frontend/coverage/lcov-report
          if-no-files-found: warn
          retention-days: 7

      - name: Build SPA
        run: docker compose --profile tools run --rm node npm run frontend:build

      - name: Audit production Node dependencies
        run: docker compose --profile tools run --rm node npm audit --omit=dev --audit-level=high

  coverage-diff:
    name: Coverage diff
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend

      - name: Install diff-cover
        run: python -m pip install diff-cover==10.4.1

      # La base e' il commit da cui parte l'evento, non un ref di branch: su un
      # push il ref del branch punta gia' al commit corrente e il diff sarebbe
      # vuoto. Pull request: base della PR. Push: commit precedente al push.
      # Senza una base utilizzabile (creazione di un branch o di un tag,
      # workflow_dispatch, commit non piu' raggiungibile) si ripiega sul
      # merge-base con il default branch, segnalandolo nel log.
      - name: Resolve diff base
        id: diff-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request) candidate="$PR_BASE_SHA"; origin="github.event.pull_request.base.sha" ;;
            push) candidate="$PUSH_BEFORE_SHA"; origin="github.event.before" ;;
            *) candidate=""; origin="nessuna base per l'evento ${EVENT_NAME}" ;;
          esac

          # Uno SHA di soli zeri indica la creazione del ref: non c'e' un commit precedente.
          if [ -n "${candidate//0/}" ] && git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
            base="$candidate"
          else
            base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
            echo "::warning::Base dell'evento non utilizzabile (${origin}: '${candidate}'): il diff coverage usa il merge-base con origin/${DEFAULT_BRANCH}."
            origin="merge-base con origin/${DEFAULT_BRANCH}"
          fi

          echo "Base: ${base} (${origin})"
          echo "Head: $(git rev-parse HEAD)"
          echo "sha=${base}" >> "$GITHUB_OUTPUT"

      # diff-cover non accetta XML e LCov nella stessa invocazione, quindi i due
      # stack vengono misurati separatamente. Ogni report descrive solo i propri
      # file: le righe modificate dell'altro stack non risultano misurate e
      # restano fuori dal conteggio, senza sovrapposizioni ne' doppi conteggi.
      # Un commit che tocca un solo stack lascia l'altra invocazione a zero righe
      # misurate: per diff-cover e' un esito positivo, e il log lo dichiara.
      - name: Check changed-line coverage
        env:
          BASE_SHA: ${{ steps.diff-base.outputs.sha }}
        run: |
          minimum="$(jq -er '.diff.lines' coverage-thresholds.json)"
          status=0

          check() {
            local report="$1" stack="$2"
            local summary="coverage/diff-coverage-${stack}.json"

            echo "::group::Coverage del codice modificato: ${stack} (minimo ${minimum}%)"
            diff-cover "$report" \
              --compare-branch="$BASE_SHA" \
              --format="html:coverage/diff-coverage-${stack}.html,markdown:coverage/diff-coverage-${stack}.md,json:${summary}" \
              --show-uncovered \
              --fail-under="$minimum" || status=1
            echo "::endgroup::"

            measured="$(jq -r '.total_num_lines' "$summary")"
            echo "${stack}: base ${BASE_SHA}, head $(git rev-parse HEAD), righe modificate ${measured} misurate su $(jq -r '.num_changed_lines' "$summary"), non coperte $(jq -r '.total_num_violations' "$summary")"
            if [ "$measured" = "0" ]; then
              echo "::notice::Coverage diff ${stack}: nessuna riga modificata misurata rispetto a ${BASE_SHA}."
            fi
          }

          check coverage/backend/cobertura.xml backend
          check coverage/frontend/lcov.info frontend

          exit "$status"

      - name: Upload changed-line coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changed-line-coverage
          path: |
            coverage/diff-coverage-backend.html
            coverage/diff-coverage-backend.md
            coverage/diff-coverage-backend.json
            coverage/diff-coverage-frontend.html
            coverage/diff-coverage-frontend.md
            coverage/diff-coverage-frontend.json
          if-no-files-found: warn
          retention-days: 7

  stack:
    name: Stack, security and a11y
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # I runner ubuntu-latest hanno ~14 GB liberi su /: insufficienti per
      # caricare tutte le immagini esterne + buildare le immagini di produzione
      # + avviare l'intero stack (LocalStack compreso). Si rimuovono i
      # toolchain preinstallati non usati per liberare oltre 20 GB ed evitare
      # "no space left on device".
      - name: Free disk space
        run: |
          echo "Spazio prima della pulizia:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          echo "Spazio dopo la pulizia:"
          df -h /

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Acquisizione immagini in ordine di preferenza: cache di Actions
      # (zero pull) -> mirror GHCR -> upstream pubblico con retry. Include
      # le basi dei Dockerfile, così le build non toccano i registry.
      - name: Resolve external images
        id: images
        run: |
          bash scripts/ci/resolve-images.sh > /tmp/ci-images.txt
          echo "Immagini esterne richieste:"
          cat /tmp/ci-images.txt
          echo "key=$(sha256sum /tmp/ci-images.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore image cache
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ci-images.tar.zst
          key: docker-images-${{ steps.images.outputs.key }}

      - name: Load images from cache
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: zstd -dc /tmp/ci-images.tar.zst | docker load

      - name: Pull images (mirror GHCR, fallback upstream)
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning::Login GHCR fallito, uso solo gli upstream"
          bash scripts/ci/pull-images.sh /tmp/ci-images.txt

      # Le esecuzioni di feature e pull request riusano la cache dei branch di
      # riferimento senza crearne copie isolate da oltre 2 GB.
      - name: Prepare image archive for cache
        if: >-
          steps.image-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          mapfile -t images < /tmp/ci-images.txt
          docker save "${images[@]}" | zstd -T0 -o /tmp/ci-images.tar.zst

      - name: Save image cache
        if: >-
          steps.image-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@v4
        with:
          path: /tmp/ci-images.tar.zst
          key: docker-images-${{ steps.images.outputs.key }}

      # --- Check statici senza build (fail fast) ---

      - name: Terraform format check
        run: docker compose --profile tools run --rm terraform fmt -check

      - name: Terraform init providers
        run: docker compose --profile tools run --rm terraform init -backend=false

      - name: Terraform validate
        run: docker compose --profile tools run --rm terraform validate

      - name: Validate observability config
        run: make observability-config

      # --- Build immagini (una sola volta su questo runner) ---

      - name: Build images
        run: docker compose build

      - name: Build production images
        run: |
          docker build \
            --build-arg COMPOSER_INSTALL_DEV=false \
            --tag local/mvp-app:${{ github.sha }} \
            --file docker/php/Dockerfile \
            .
          docker build \
            --tag local/mvp-nginx:${{ github.sha }} \
            --file docker/nginx/Dockerfile \
            .

      - name: Scan images with Trivy
        run: |
          for image in app nginx; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivy-cache:/root/.cache" \
              ghcr.io/aquasecurity/trivy:0.66.0 \
              image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --scanners vuln,secret,config \
              --ignore-unfixed \
              "local/mvp-${image}:${{ github.sha }}"
          done

      # --- Stack completo: smoke HTTPS + accessibilità sullo stesso ambiente ---

      - name: Generate local TLS certificate
        # Stesso script di make local-tls: i SAN (incluso *.localhost per le
        # dashboard) vivono in un posto solo
        run: sh scripts/tls/generate-local-cert.sh docker/traefik/certs/mvp-local.test.crt docker/traefik/certs/mvp-local.test.key

      - name: Start dependencies
        run: docker compose up -d postgres redis localstack

      - name: Apply LocalStack infrastructure
        run: docker compose --profile tools run --rm terraform init && docker compose --profile tools run --rm terraform apply -auto-approve

      # Il percorso di serving default e' Traefik -> edge-cdn -> S3
      # LocalStack: lo smoke e gli audit a11y devono colpire la SPA realmente
      # caricata nel bucket, non un bucket vuoto. Si riusa la stessa logica di
      # make setup (build + sync con cache-control differenziato).
      - name: Build and deploy Angular SPA to LocalStack S3
        run: |
          make frontend-build
          make frontend-s3-local-upload

      - name: Run migrations
        run: docker compose --profile release run --rm migrate

      - name: Start runtime
        run: docker compose up -d app queue nginx traefik otel-collector prometheus tempo alertmanager grafana

      - name: Smoke HTTPS endpoints
        run: |
          # Le dashboard non espongono più porte host: si passa da Traefik con
          # routing per hostname (*.localhost) e basic auth (docker/traefik/usersfile).
          wait_for() {
            for _ in {1..120}; do
              if curl --silent --fail --insecure "$@" > /dev/null; then
                return 0
              fi

              sleep 2
            done

            echo "::error::Timeout waiting for $1"
            return 1
          }

          obs_curl() {
            local host="$1" path="$2"
            wait_for "https://${host}:8443${path}" \
              --resolve "${host}:8443:127.0.0.1" \
              --user "mvp:mvp-obs-local-password"
          }

          wait_for https://localhost:8443/health

          curl --silent --fail --insecure https://localhost:8443/health
          curl --silent --fail --insecure https://localhost:8443/ready
          curl --silent --fail --insecure https://localhost:8443/api/v1/state
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure https://localhost:8443/internal/metrics)" = "404"
          docker compose exec -T nginx wget -q -O - http://127.0.0.1:8081/internal/metrics | grep mvp_app_info

          # Security headers: CSP enforced ovunque, con frame-ancestors 'self'
          # solo sulla preview PDF (incorporata in iframe dalla SPA)
          spa_headers="$(curl --silent --insecure -I https://localhost:8443/)"
          echo "$spa_headers" | grep -i '^content-security-policy:' | grep -F "frame-ancestors 'none'"
          echo "$spa_headers" | grep -i '^x-content-type-options: nosniff'
          echo "$spa_headers" | grep -i '^referrer-policy: strict-origin-when-cross-origin'

          # La SPA Angular deve essere servita da S3 LocalStack via edge-cdn,
          # sia sulla root sia su un deep link (fallback SPA verso index.html)
          curl --silent --fail --insecure https://localhost:8443/ | grep -q '<mvp-root'
          curl --silent --fail --insecure https://localhost:8443/copilot | grep -q '<mvp-root'
          curl --silent --insecure -I https://localhost:8443/api/v1/documents/1/preview \
            | grep -i '^content-security-policy:' | grep -F "frame-ancestors 'self'"

          obs_curl prometheus.localhost /-/ready
          obs_curl alertmanager.localhost /-/ready
          wait_for https://grafana.localhost:8443/api/health \
            --resolve grafana.localhost:8443:127.0.0.1
          # Senza credenziali le UI protette devono rispondere 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure --resolve prometheus.localhost:8443:127.0.0.1 https://prometheus.localhost:8443/-/ready)" = "401"

      # Il volume node-modules è per-job: l'npm ci del job frontend non è
      # disponibile qui e va rieseguito prima degli audit a11y
      - name: Install audit dependencies
        run: docker compose --profile tools run --rm node npm ci --ignore-scripts

      - name: Smoke SPA with enforced CSP
        run: docker compose --profile tools run --rm frontend-audit node scripts/a11y/csp-smoke.mjs
          https://traefik:8443/overview https://traefik:8443/assistant https://traefik:8443/copilot

      - name: Run axe
        run: docker compose --profile tools run --rm frontend-audit node scripts/a11y/axe-playwright.mjs
          https://traefik:8443/overview https://traefik:8443/assistant https://traefik:8443/copilot

      - name: Run Pa11y
        run: docker compose --profile tools run --rm frontend-audit node scripts/a11y/pa11y-runner.mjs
          https://traefik:8443/overview https://traefik:8443/assistant https://traefik:8443/copilot

      - name: Collect stack diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/stack-diagnostics
          docker compose ps --all > artifacts/stack-diagnostics/compose-ps.txt
          docker compose logs --no-color --timestamps > artifacts/stack-diagnostics/compose.log 2>&1
          docker system df > artifacts/stack-diagnostics/docker-disk-usage.txt

      - name: Upload stack diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-diagnostics
          path: artifacts/stack-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans

      # --- Pubblicazione su GHCR (come il vecchio workflow Containers:
      #     indipendente dagli esiti di backend/frontend) ---

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (app)
        if: github.event_name != 'pull_request'
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mvp-app
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      - name: Docker metadata (nginx)
        if: github.event_name != 'pull_request'
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mvp-nginx
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      - name: Push images to GHCR
        if: github.event_name != 'pull_request'
        env:
          APP_TAGS: ${{ steps.meta-app.outputs.tags }}
          NGINX_TAGS: ${{ steps.meta-nginx.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "local/mvp-app:${{ github.sha }}" "$tag"
            docker push "$tag"
          done <<< "$APP_TAGS"

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "local/mvp-nginx:${{ github.sha }}" "$tag"
            docker push "$tag"
          done <<< "$NGINX_TAGS"
